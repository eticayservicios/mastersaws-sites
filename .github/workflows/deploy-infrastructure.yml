name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a desplegar
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: SAM deploy S3 + CloudFront
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validar credenciales AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || (echo "::error::Falta AWS_ACCESS_KEY_ID" && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo "::error::Falta AWS_SECRET_ACCESS_KEY" && exit 1)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Validar plantilla
        run: sam validate --lint -t infrastructure/template.yaml --region ${{ env.AWS_REGION }}

      - name: Desplegar stack
        run: |
          sam deploy \
            --config-env "${{ inputs.environment }}" \
            --template-file infrastructure/template.yaml \
            --stack-name "mastersaws-portfolio-${{ inputs.environment }}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "ProjectName=mastersaws-portfolio" \
              "Environment=${{ inputs.environment }}" \
              "BucketName=mastersaws-portfolio-${{ inputs.environment }}"

      - name: Mostrar outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "mastersaws-portfolio-${{ inputs.environment }}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output table
