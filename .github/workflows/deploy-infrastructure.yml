name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a desplegar
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: CloudFormation S3 + CloudFront
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validar credenciales AWS
        env:
          KEY_FROM_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_FROM_VAR: ${{ vars.AWS_ACCESS_KEY_ID }}
          SECRET_FROM_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_FROM_VAR: ${{ vars.AWS_SECRET_ACCESS_KEY }}
        run: |
          AWS_ACCESS_KEY_ID="${KEY_FROM_SECRET:-$KEY_FROM_VAR}"
          AWS_SECRET_ACCESS_KEY="${SECRET_FROM_SECRET:-$SECRET_FROM_VAR}"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Faltan AWS_ACCESS_KEY_ID y/o AWS_SECRET_ACCESS_KEY."
            echo "::error::Configúralos en Settings → Secrets and variables → Actions (Variables o Secrets)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar cuenta AWS
        run: aws sts get-caller-identity --output table

      - name: Validar plantilla
        run: aws cloudformation validate-template --template-body file://infrastructure/template.yaml

      - name: Desplegar stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name "mastersaws-portfolio-${{ inputs.environment }}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectName=mastersaws-portfolio" \
              "Environment=${{ inputs.environment }}" \
              "BucketName=mastersaws-portfolio-${{ inputs.environment }}" \
              "PriceClass=PriceClass_100"

      - name: Mostrar outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "mastersaws-portfolio-${{ inputs.environment }}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output table
