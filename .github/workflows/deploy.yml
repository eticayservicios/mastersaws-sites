name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - prod
    paths:
      - 'sites/**'
      - 'scripts/publish-s3-directory-indexes.sh'
      - '.github/workflows/deploy.yml'

env:
  AWS_REGION: us-east-1
  STACK_NAME: mastersaws-portfolio-prod

permissions:
  contents: read

jobs:
  deploy:
    name: Subir sitios a S3 + índices de directorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        env:
          KEY_VAR: ${{ vars.AWS_ACCESS_KEY_ID }}
          SECRET_VAR: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          KEY_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          AWS_ACCESS_KEY_ID="${KEY_VAR:-$KEY_SECRET}"
          AWS_SECRET_ACCESS_KEY="${SECRET_VAR:-$SECRET_SECRET}"

          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Faltan AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> "$GITHUB_ENV"

      - name: Verificar cuenta AWS
        run: aws sts get-caller-identity --output table

      - name: Resolver bucket y CloudFront
        id: target
        env:
          S3_GENERIC_VAR: ${{ vars.S3_BUCKET }}
          S3_GENERIC_SECRET: ${{ secrets.S3_BUCKET }}
          CF_GENERIC_VAR: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CF_GENERIC_SECRET: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PROD_S3_VAR: ${{ vars.PROD_S3_BUCKET }}
          PROD_S3_SECRET: ${{ secrets.PROD_S3_BUCKET }}
          PROD_CF_VAR: ${{ vars.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
          PROD_CF_SECRET: ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
          PATH_PREFIX_VAR: ${{ vars.S3_PATH_PREFIX }}
          PATH_PREFIX_SECRET: ${{ secrets.S3_PATH_PREFIX }}
        run: |
          S3_BUCKET="${PROD_S3_VAR:-$PROD_S3_SECRET}"
          CF_ID="${PROD_CF_VAR:-$PROD_CF_SECRET}"
          LEGACY=0
          PATH_PREFIX="${PATH_PREFIX_VAR:-${PATH_PREFIX_SECRET:-servicios}}"

          if [ -n "$S3_BUCKET" ] && [ -n "$CF_ID" ]; then
            LEGACY=1
            echo "Modo: bucket compartido www.mastersaws.com (PROD_S3_BUCKET)"
          else
            S3_BUCKET="${S3_GENERIC_VAR:-$S3_GENERIC_SECRET}"
            CF_ID="${CF_GENERIC_VAR:-$CF_GENERIC_SECRET}"
            PATH_PREFIX=""
          fi

          if [ -z "$S3_BUCKET" ] || [ -z "$CF_ID" ]; then
            echo "Leyendo outputs del stack ${STACK_NAME}..."
            if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "::error::No se pudo resolver bucket/CloudFront."
              echo "::error::Configura PROD_S3_BUCKET y PROD_CLOUDFRONT_DISTRIBUTION_ID (www.mastersaws.com)."
              exit 1
            fi
            OUTPUTS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].Outputs' \
              --output json)
            S3_BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue')
            CF_ID=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')
            echo "Modo: stack CloudFormation ${STACK_NAME}"
          fi

          if [ -z "$S3_BUCKET" ] || [ "$S3_BUCKET" = "null" ] || [ -z "$CF_ID" ] || [ "$CF_ID" = "null" ]; then
            echo "::error::Bucket o CloudFront inválidos."
            exit 1
          fi

          echo "legacy_mode=$LEGACY" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$S3_BUCKET" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$CF_ID" >> "$GITHUB_OUTPUT"
          echo "path_prefix=$PATH_PREFIX" >> "$GITHUB_OUTPUT"
          echo "Bucket: $S3_BUCKET"
          echo "Prefijo S3: ${PATH_PREFIX:-/}"
          echo "CloudFront: $CF_ID"

      - name: Sincronizar landings a S3 (modo compartido www.mastersaws.com)
        if: steps.target.outputs.legacy_mode == '1'
        run: |
          BUCKET="${{ steps.target.outputs.s3_bucket }}"
          PREFIX="${{ steps.target.outputs.path_prefix }}"
          PREFIX="${PREFIX#/}"
          PREFIX="${PREFIX%/}"
          [ -n "$PREFIX" ] && DEST_PREFIX="${PREFIX}/" || DEST_PREFIX=""
          # Productos comerciales en la raíz del sitio (no bajo /servicios/)
          ROOT_LANDINGS="mastervpn tarjetas-nfc"
          for dir in sites/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if echo " $ROOT_LANDINGS " | grep -q " $name "; then
              echo "Sync raíz s3://${BUCKET}/${name}/"
              aws s3 sync "$dir" "s3://${BUCKET}/${name}/" \
                --exact-timestamps \
                --delete
            else
              echo "Sync s3://${BUCKET}/${DEST_PREFIX}${name}/"
              aws s3 sync "$dir" "s3://${BUCKET}/${DEST_PREFIX}${name}/" \
                --exact-timestamps \
                --delete
            fi
          done
          if [ -d paises ]; then
            for dir in paises/*/; do
              [ -d "$dir" ] || continue
              name=$(basename "$dir")
              echo "Sync país s3://${BUCKET}/${name}/"
              aws s3 sync "$dir" "s3://${BUCKET}/${name}/" \
                --exact-timestamps
            done
          fi

      - name: Sincronizar sitios a S3 (modo stack IaC)
        if: steps.target.outputs.legacy_mode != '1'
        run: |
          for dir in sites/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            aws s3 sync "$dir" "s3://${{ steps.target.outputs.s3_bucket }}/${name}/" \
              --exact-timestamps
          done
          if [ -d paises ]; then
            for dir in paises/*/; do
              [ -d "$dir" ] || continue
              name=$(basename "$dir")
              aws s3 sync "$dir" "s3://${{ steps.target.outputs.s3_bucket }}/${name}/" \
                --exact-timestamps
            done
          fi

      - name: Publicar índices de directorio (barra final)
        run: |
          chmod +x scripts/publish-s3-directory-indexes.sh
          BUCKET="${{ steps.target.outputs.s3_bucket }}"
          PREFIX="${{ steps.target.outputs.path_prefix }}"
          ROOT_LANDINGS="mastervpn tarjetas-nfc"

          # Índices bajo /servicios/ (u otro prefijo) excepto landings de raíz
          TMP_SITES=$(mktemp -d)
          for dir in sites/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if echo " $ROOT_LANDINGS " | grep -q " $name "; then
              continue
            fi
            mkdir -p "$TMP_SITES/$name"
            cp "$dir/index.html" "$TMP_SITES/$name/index.html"
          done
          ./scripts/publish-s3-directory-indexes.sh "$BUCKET" "$TMP_SITES" "$PREFIX"
          rm -rf "$TMP_SITES"

          # Índices en la raíz del dominio para productos
          TMP_ROOT=$(mktemp -d)
          for name in $ROOT_LANDINGS; do
            if [ -f "sites/$name/index.html" ]; then
              mkdir -p "$TMP_ROOT/$name"
              cp "sites/$name/index.html" "$TMP_ROOT/$name/index.html"
            fi
          done
          ./scripts/publish-s3-directory-indexes.sh "$BUCKET" "$TMP_ROOT" ""
          rm -rf "$TMP_ROOT"

          if [ -d paises ]; then
            ./scripts/publish-s3-directory-indexes.sh \
              "$BUCKET" \
              paises \
              ""
          fi

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.target.outputs.cloudfront_id }}" \
            --paths "/*"

      - name: Listo
        run: |
          echo "Despliegue completado."
          echo "Bucket: ${{ steps.target.outputs.s3_bucket }}"
          echo "Ejemplo: https://www.mastersaws.com/servicios/gobernanza-ia/"
