name: Deploy all

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a desplegar
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: IaC + contenido
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validar credenciales AWS
        env:
          KEY_FROM_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_FROM_VAR: ${{ vars.AWS_ACCESS_KEY_ID }}
          SECRET_FROM_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_FROM_VAR: ${{ vars.AWS_SECRET_ACCESS_KEY }}
        run: |
          AWS_ACCESS_KEY_ID="${KEY_FROM_SECRET:-$KEY_FROM_VAR}"
          AWS_SECRET_ACCESS_KEY="${SECRET_FROM_SECRET:-$SECRET_FROM_VAR}"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Faltan AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY en Variables o Secrets."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar cuenta AWS
        run: aws sts get-caller-identity --output table

      - name: "Paso 1/4: Validar plantilla IaC"
        run: aws cloudformation validate-template --template-body file://infrastructure/template.yaml

      - name: "Paso 2/4: Crear o actualizar S3 + CloudFront"
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name "mastersaws-portfolio-${{ inputs.environment }}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectName=mastersaws-portfolio" \
              "Environment=${{ inputs.environment }}" \
              "BucketName=mastersaws-portfolio-${{ inputs.environment }}" \
              "PriceClass=PriceClass_100"

      - name: "Paso 3/4: Leer outputs del stack"
        id: stack
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "mastersaws-portfolio-${{ inputs.environment }}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output json)

          S3_BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue')
          CF_ID=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')
          SITE_URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="SiteUrl") | .OutputValue')

          echo "s3_bucket=$S3_BUCKET" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$CF_ID" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

          echo "Bucket creado por IaC:    $S3_BUCKET"
          echo "CloudFront creado por IaC: $CF_ID"
          echo "URL del sitio:             $SITE_URL"

      - name: "Paso 4/4: Subir sitios e invalidar CloudFront"
        run: |
          aws s3 sync sites/ "s3://${{ steps.stack.outputs.s3_bucket }}/" \
            --delete \
            --exact-timestamps

          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.cloudfront_id }}" \
            --paths "/*"

      - name: Resumen
        run: |
          echo "Despliegue completo."
          echo "URL: ${{ steps.stack.outputs.site_url }}"
          echo "Rutas: /cloudadoption/ /devops/ /finops/ /data-analytics/ ..."
