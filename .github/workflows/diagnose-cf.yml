name: Diagnose CF
on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths: ['.github/workflows/diagnose-cf.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Find routing targets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          DOMAIN=$(aws cloudfront get-distribution --id E1SKSIPFEZUHQ4 --query 'Distribution.DomainName' --output text)
          echo "CF_DOMAIN=$DOMAIN"
          echo "=== distributions ==="
          aws cloudfront list-distributions --query "DistributionList.Items[].{Id:Id,Domain:DomainName,Aliases:Aliases.Items,Comment:Comment}" --output table
          echo "=== EC2 all us-east-1 public IPs ==="
          aws ec2 describe-instances --query "Reservations[].Instances[].{Id:InstanceId,Pub:PublicIpAddress,Priv:PrivateIpAddress,Name:Tags[?Key=='Name']|[0].Value,Key:KeyName,State:State.Name}" --output table
          echo "=== try SSM ==="
          aws ssm describe-instance-information --output table || true
          echo "=== buckets ==="
          aws s3 ls | head -50
