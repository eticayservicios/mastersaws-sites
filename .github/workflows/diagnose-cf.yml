name: Diagnose CF
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and nginx workaround options
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          echo "=== Route53 zones ==="
          aws route53 list-hosted-zones --query "HostedZones[].{Name:Name,Id:Id}" --output table || true
          echo "=== How www tarjetas is served: compare CF-Ids ==="
          curl -sI "https://www.mastersaws.com/tarjetas-nfc/" | egrep -i "via|x-amz-cf|x-cache|content-length|last-modified"
          curl -sI "https://d2easup7g60n7n.cloudfront.net/tarjetas-nfc/" | egrep -i "via|x-amz-cf|x-cache|content-length|last-modified|etag"
          curl -sI "https://d2ztwmb3517u1g.cloudfront.net/" | egrep -i "via|content-length|last-modified|etag|HTTP" | head -15
          echo "=== portfolio mastervpn still ok ==="
          curl -sI "https://d2easup7g60n7n.cloudfront.net/mastervpn/" | head -12
